# Native la-briguade extension for DeepSeek Harness (DSH) profiles.
# The adapter itself can run in any profile with its required services. Generated
# selectable presets are added only when the host profile already owns the
# `agent-presets` roster (for example, the shipped Web profile).

- insert:
    - id: la-briguade-dsh
      name: la-briguade-dsh
      config:
        maxDelegationDepth: 1

# Do not insert a second agent-presets service: the Web profile already mounts
# this row and Cordis rejects duplicate loader IDs. A missing row is a safe
# no-op, so a bare/headless profile still loads the adapter's skills and tools.
- id: agent-presets
  config:
    # DSH 0.1.5-rc.2 requires a default whenever this roster is mounted.
    default: builder
    roots:
      # `baseUrl` is the generated profile's cordis.yml, not this package.
      # Resolve the installed (or linked) bundle from that profile so this remains
      # portable for both `dsh plugin add ./dsh` and published installations.
      - path: !!js "process.getBuiltinModule('node:path').join(process.getBuiltinModule('node:path').dirname(process.getBuiltinModule('node:module').createRequire(baseUrl).resolve('la-briguade-dsh/package.json')), 'presets')"
        trust: system
